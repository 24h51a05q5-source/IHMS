version: '3.8'

services:
  # Shared PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ihms_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ihms_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application Server 1
  app1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ihms_app_1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: app-server-1
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ihms_db}
      DB_POOL_MAX: 20
      DB_POOL_MIN: 5
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-ihms-jwt-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-ihms-2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Application Server 2
  app2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ihms_app_2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: app-server-2
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ihms_db}
      DB_POOL_MAX: 20
      DB_POOL_MIN: 5
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-ihms-jwt-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-ihms-2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Application Server 3
  app3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ihms_app_3
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      INSTANCE_ID: app-server-3
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-ihms_db}
      DB_POOL_MAX: 20
      DB_POOL_MIN: 5
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-ihms-jwt-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-key-ihms-2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ihms_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - app1
      - app2
      - app3

  # Nginx Load Balancer / Reverse Proxy
  loadbalancer:
    image: nginx:alpine
    container_name: ihms_loadbalancer
    restart: always
    ports:
      - "80:80"
      - "5000:80"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
      - frontend

volumes:
  postgres_data:

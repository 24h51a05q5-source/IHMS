# IHMS ERP Production Load Balancer Configuration
# Reverse Proxy & Load Balancer with Least Connections & Automatic Failover

events {
    worker_connections 2048;
}

http {
    # MIME Types & Logs
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr '
                            'status: $upstream_status '
                            'time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log  /var/log/nginx/error.log warn;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Upstream Backend Application Instances
    # Load Balancing Strategy: Least Connections (least_conn)
    # Failover: max_fails=3 fail_timeout=10s
    upstream ihms_backend_cluster {
        least_conn;
        server app1:5000 max_fails=3 fail_timeout=10s;
        server app2:5000 max_fails=3 fail_timeout=10s;
        server app3:5000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Upstream Frontend Application Instances (Next.js)
    upstream ihms_frontend_cluster {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Transparent Reverse Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Automatic Failover Configuration
        # If an application instance fails, immediately retry the next available healthy server
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Load Balancer Health Probe
        location /lb-health {
            access_log off;
            return 200 "Load balancer is operational.\n";
            add_header Content-Type text/plain;
        }

        # Route /api/ to backend application cluster
        location /api/ {
            proxy_pass http://ihms_backend_cluster;
            
            # Pass through instance headers for verification
            proxy_pass_header X-Handled-By;
            proxy_pass_header X-Server-Instance;
        }

        # WebSocket Gateway Support (/socket.io/)
        location /socket.io/ {
            proxy_pass http://ihms_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Route all other web traffic to Frontend cluster
        location / {
            proxy_pass http://ihms_frontend_cluster;
        }
    }
}

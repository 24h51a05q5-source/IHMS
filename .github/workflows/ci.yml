name: IHMS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build and Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Backend Build
        run: npm run build:backend

      - name: Validate Frontend Typecheck
        run: npm --workspace=frontend run typecheck

      - name: Run Automated System Integrity Suite
        run: npm run test:integrity

      - name: Run Automated Financial Calculation Engine Suite
        run: npm run test:financial-calc

      - name: Run Device-Aware Checkout & Easy Split Suite
        run: npm run test:checkout-split
